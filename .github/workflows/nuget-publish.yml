name: Publish NuGet Packages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '.github/workflows/nuget-publish.yml'

jobs:
  publish:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: coreone.drawing
            path: src/CoreOne.Drawing/CoreOne.Drawing.csproj
          - name: coreone.winforms
            path: src/CoreOne.Winforms/CoreOne.Winforms.csproj

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Get project version
        id: get_version
        run: |
          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' ${{ matrix.project.path }} | head -n1)
          echo "Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if package version exists on NuGet
        id: check_nuget
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PACKAGE_NAME="${{ matrix.project.name }}"
          # NuGet normalizes versions (1.5 -> 1.5.0, 1.5.0.0 -> 1.5.0)
          IFS=. read -r V1 V2 V3 V4 <<< "$VERSION"
          VERSION="$V1.${V2:-0}.${V3:-0}"
          if [ -n "$V4" ] && [ "$V4" != "0" ]; then VERSION="$VERSION.$V4"; fi
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.nuget.org/v3-flatcontainer/$PACKAGE_NAME/$VERSION/$PACKAGE_NAME.$VERSION.nupkg)

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Package version $VERSION already exists on NuGet."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package version $VERSION does NOT exist on NuGet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build project
        run: dotnet build ${{ matrix.project.path }} --configuration Release

      - name: Pack NuGet
        if: steps.check_nuget.outputs.exists == 'false'
        run: dotnet pack ${{ matrix.project.path }} --configuration Release

      - name: NuGet login (OIDC → temp API key)
        if: steps.check_nuget.outputs.exists == 'false'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: steps.check_nuget.outputs.exists == 'false'
        run: dotnet nuget push $(dirname ${{ matrix.project.path }})/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
