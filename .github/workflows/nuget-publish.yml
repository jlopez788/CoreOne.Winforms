name: Publish NuGet Packages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '.github/workflows/nuget-publish.yml'

jobs:
  publish:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        project:
          - name: coreone.drawing
            path: src/CoreOne.Drawing/CoreOne.Drawing.csproj
          - name: coreone.winforms
            path: src/CoreOne.Winforms/CoreOne.Winforms.csproj

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.*'

      - name: Get Project Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" ${{ matrix.project.path }})
          echo "Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if package version exists on NuGet
        id: check_nuget
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PACKAGE_NAME="${{ matrix.project.name }}"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.nuget.org/v3-flatcontainer/$PACKAGE_NAME/$VERSION/$PACKAGE_NAME.$VERSION.nupkg)

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Package version $VERSION already exists on NuGet."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package version $VERSION does NOT exist on NuGet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build project
        run: dotnet build ${{ matrix.project.path }} --configuration Release

      - name: Pack NuGet
        if: steps.check_nuget.outputs.exists == 'false'
        run: dotnet pack ${{ matrix.project.path }} --configuration Release

      - name: NuGet login (OIDC → temp API key)
        if: steps.check_nuget.outputs.exists == 'false'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: steps.check_nuget.outputs.exists == 'false'
        shell: bash
        run: dotnet nuget push $(dirname ${{ matrix.project.path }})/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
